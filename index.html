<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantonese Classifier Memory Game - SLP Edition</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #4A90E2;
      --secondary: #2ECC71;
      --accent: #E74C3C;
      --bg: #F0F4F8;
      --card-bg: #FFFFFF;
      --card-back: #357ABD;
      --text: #2C3E50;
    }

    body {
      font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 5px;
      margin-bottom: 10px;
      color: var(--primary);
      text-align: center;
    }

    .setup-panel, .tracker-panel {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }

    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .checkbox-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: #EAEFF5;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 1.1rem;
    }

    .checkbox-btn input { display: none; }

    .checkbox-btn.selected {
      background: var(--primary);
      color: white;
      font-weight: bold;
    }

    select, button, input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #CCC;
      box-sizing: border-box;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #357ABD; }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 640px;
      width: 100%;
      margin-bottom: 20px;
    }

    .card {
      aspect-ratio: 1 / 1;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.4s ease-in-out;
      transform-style: preserve-3d;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 6px;
    }

    .card-back {
      background: var(--card-back);
      color: white;
      font-size: 2.2rem;
      font-weight: bold;
    }

    .card-front {
      background: var(--card-bg);
      transform: rotateY(180deg);
      border: 3px solid var(--primary);
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    /* GENTLE 2-TIMES BLINK ANIMATION */
    @keyframes gentle-blink-two-times {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .card.matched-highlight {
      animation: gentle-blink-two-times 0.4s ease-in-out 2;
    }

    .card.matched-highlight .card-front {
      border: 4px solid var(--secondary);
      box-shadow: 0 0 18px rgba(46, 204, 113, 0.9);
    }

    .card-img {
      width: 85%;
      height: 85%;
      object-fit: contain;
      border-radius: 6px;
    }

    /* Dimmed face-down matched state */
    .card.matched .card-inner {
      opacity: 0.35;
      filter: grayscale(60%);
    }

    /* Completion Overlay Pop-up Modal */
    .victory-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.3s ease-out;
    }

    .victory-modal {
      background: white;
      padding: 32px 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      max-width: 90%;
      width: 380px;
      animation: scaleUp 0.3s ease-out;
    }

    .victory-modal h2 {
      color: var(--secondary);
      font-size: 2.2rem;
      margin: 0 0 12px 0;
    }

    .victory-modal p {
      font-size: 1.15rem;
      color: var(--text);
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .victory-modal button {
      background: var(--secondary);
      font-size: 1.1rem;
      padding: 12px 28px;
      width: auto;
      border-radius: 10px;
    }

    .victory-modal button:hover {
      background: #27AE60;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleUp {
      from { transform: scale(0.75); }
      to { transform: scale(1); }
    }

    /* Tracker Panel */
    .tracker-panel {
      border: 2px solid var(--primary);
      background: #F8FAFC;
    }

    .tracker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #E2E8F0;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .tracker-header h2 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--primary);
    }

    .name-input-box {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .name-input-box label {
      margin-bottom: 0;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    .name-input-box input {
      padding: 6px 10px;
      font-size: 0.95rem;
    }

    .export-btn {
      width: auto;
      padding: 6px 12px;
      font-size: 0.85rem;
      background: var(--secondary);
    }

    .export-btn:hover { background: #27AE60; }

    .tracker-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .tracker-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #E2E8F0;
    }

    .tracker-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tracker-thumb {
      width: 32px;
      height: 32px;
      object-fit: cover;
      border-radius: 4px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .track-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      font-size: 1.1rem;
      border-radius: 6px;
      border: 1px solid #CCC;
      background: #EDF2F7;
      color: #4A5568;
    }

    .track-btn.correct.active {
      background: var(--secondary);
      color: white;
      border-color: var(--secondary);
    }

    .track-btn.incorrect.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .summary-box {
      background: white;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      border: 1px dashed var(--primary);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h1>量詞配對翻牌遊戲</h1>

  <!-- Setup Panel -->
  <div id="setup-panel" class="setup-panel">
    <div class="form-group">
      <label>1. 選擇 2 至 3 個目標量詞：</label>
      <div class="checkbox-group" id="classifier-options">
        <label class="checkbox-btn"><input type="checkbox" value="個">個</label>
        <label class="checkbox-btn"><input type="checkbox" value="條">條</label>
        <label class="checkbox-btn"><input type="checkbox" value="件">件</label>
        <label class="checkbox-btn"><input type="checkbox" value="隻">隻</label>
        <label class="checkbox-btn"><input type="checkbox" value="粒">粒</label>
        <label class="checkbox-btn"><input type="checkbox" value="架">架</label>
        <label class="checkbox-btn"><input type="checkbox" value="張">張</label>
        <label class="checkbox-btn"><input type="checkbox" value="塊">塊</label>
      </div>
    </div>

    <div class="form-group">
      <label for="card-count">2. 選擇卡牌總數：</label>
      <select id="card-count">
        <option value="8">8 張牌 (4 對)</option>
        <option value="10">10 張牌 (5 對)</option>
        <option value="12" selected>12 張牌 (6 對)</option>
        <option value="14">14 張牌 (7 對)</option>
        <option value="16">16 張牌 (8 對)</option>
      </select>
    </div>

    <button id="start-btn">開始遊戲 Start Game</button>
  </div>

  <!-- Game Controls -->
  <div id="game-controls" class="hidden" style="width: 100%; max-width: 640px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
    <button id="reset-btn" style="width: auto; padding: 8px 16px;">← 返回設定 Setup</button>
    <div id="status" style="font-weight: bold; color: var(--secondary);"></div>
  </div>

  <!-- Game Board -->
  <div id="game-board" class="game-board hidden"></div>

  <!-- Salient Victory Screen Modal Overlay -->
  <div id="victory-overlay" class="victory-overlay hidden">
    <div class="victory-modal">
      <h2>🎉 完成所有配對！</h2>
      <p>太棒了！你已經順利完成所有量詞卡牌配對！</p>
      <button onclick="closeVictoryOverlay()">確定 OK</button>
    </div>
  </div>

  <!-- Performance Tracker Panel -->
  <div id="tracker-panel" class="tracker-panel hidden">
    <div class="tracker-header">
      <h2>紀錄面板 (Data Tracker)</h2>
      <button class="export-btn" id="export-img-btn">📷 匯出紀錄圖片 (Export Image)</button>
    </div>

    <div class="name-input-box">
      <label for="child-name">學生/兒童名字 (Name):</label>
      <input type="text" id="child-name" placeholder="請輸入名字...">
    </div>

    <div class="tracker-list" id="tracker-list"></div>
    <div class="summary-box" id="summary-box">總正確率：尚未紀錄</div>
  </div>

    let selectedClassifiers = [];
    let flippedCards = [];
    let activeMatchedCards = [];
    let matchedPairsCount = 0;
    let totalPairs = 0;
    let isBoardLocked = false;
    let trackedResults = {};

    const setupPanel = document.getElementById('setup-panel');
    const gameBoard = document.getElementById('game-board');
    const gameControls = document.getElementById('game-controls');
    const trackerPanel = document.getElementById('tracker-panel');
    const trackerList = document.getElementById('tracker-list');
    const summaryBox = document.getElementById('summary-box');
    const statusText = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const exportImgBtn = document.getElementById('export-img-btn');
    const childNameInput = document.getElementById('child-name');
    const victoryOverlay = document.getElementById('victory-overlay');
    const classifierBoxes = document.querySelectorAll('#classifier-options input');

    classifierBoxes.forEach(box => {
      box.addEventListener('change', (e) => {
        const parent = e.target.parentElement;
        if (e.target.checked) parent.classList.add('selected');
        else parent.classList.remove('selected');
      });
    });

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', () => {
      finalizeActiveCards();
      closeVictoryOverlay();
      gameBoard.classList.add('hidden');
      gameControls.classList.add('hidden');
      trackerPanel.classList.add('hidden');
      setupPanel.classList.remove('hidden');
    });

    exportImgBtn.addEventListener('click', exportTrackerAsImage);

    function startGame() {
      finalizeActiveCards();
      closeVictoryOverlay();
      
      selectedClassifiers = Array.from(classifierBoxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);

      if (selectedClassifiers.length < 2 || selectedClassifiers.length > 3) {
        alert('請選擇 2 至 3 個目標量詞！');
        return;
      }

      const cardCount = parseInt(document.getElementById('card-count').value);
      totalPairs = cardCount / 2;

      const chosenPool = [];
      let currentClassifierIdx = 0;

      const tempDatabase = {};
      selectedClassifiers.forEach(c => {
        tempDatabase[c] = [...itemsDatabase[c]];
      });

      while (chosenPool.length < totalPairs) {
        const classifier = selectedClassifiers[currentClassifierIdx % selectedClassifiers.length];
        const items = tempDatabase[classifier];

        if (items.length > 0) {
          const randomIdx = Math.floor(Math.random() * items.length);
          const pickedItem = items.splice(randomIdx, 1)[0];
          
          chosenPool.push({
            classifier: classifier,
            name: pickedItem.name,
            img: pickedItem.img,
            fullText: `一${classifier}${pickedItem.name}`
          });
        }
        currentClassifierIdx++;
      }

      let cardsData = [...chosenPool, ...chosenPool].map((item, index) => ({ ...item, id: index }));
      cardsData = shuffle(cardsData);

      trackedResults = {};
      chosenPool.forEach(item => {
        trackedResults[item.fullText] = { classifier: item.classifier, status: null };
      });

      renderBoard(cardsData);
      renderTracker(chosenPool);

      setupPanel.classList.add('hidden');
      gameControls.classList.remove('hidden');
      gameBoard.classList.remove('hidden');
      trackerPanel.classList.remove('hidden');
      statusText.textContent = '';
      matchedPairsCount = 0;
      flippedCards = [];
      activeMatchedCards = [];
      isBoardLocked = false;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function renderBoard(cards) {
      gameBoard.innerHTML = '';
      cards.forEach(card => {
        const cardElem = document.createElement('div');
        cardElem.classList.add('card');
        cardElem.dataset.fullText = card.fullText;

        cardElem.innerHTML = `
          <div class="card-inner">
            <div class="card-back">?</div>
            <div class="card-front">
              <img src="${card.img}" class="card-img" alt="${card.name}">
            </div>
          </div>
        `;

        cardElem.addEventListener('click', () => handleCardClick(cardElem));
        gameBoard.appendChild(cardElem);
      });
    }

    // Turns active face-up matched cards face-down
    function finalizeActiveCards() {
      if (activeMatchedCards.length > 0) {
        activeMatchedCards.forEach(c => {
          c.classList.remove('flipped', 'matched-highlight');
          c.classList.add('matched');
        });
        activeMatchedCards = [];
      }
    }

    function handleCardClick(card) {
      if (isBoardLocked) return;

      // SPECIAL CASE: Tapping active face-up matched card(s)
      if (activeMatchedCards.includes(card)) {
        if (matchedPairsCount === totalPairs) {
          // If this was the final pair on the board, highlight, flip face-down, and trigger victory!
          isBoardLocked = true;
          activeMatchedCards.forEach(c => c.classList.add('matched-highlight'));
          setTimeout(() => {
            finalizeActiveCards();
            triggerVictory();
            isBoardLocked = false;
          }, 800);
        } else {
          // Normal pair tap: flip face-down
          finalizeActiveCards();
        }
        return;
      }

      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

      // If tapping any other card, close previous active matched pair
      finalizeActiveCards();

      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        checkMatch();
      }
    }

    function checkMatch() {
      isBoardLocked = true;
      const [card1, card2] = flippedCards;

      if (card1.dataset.fullText === card2.dataset.fullText) {
        // Keeps the matched cards active & face-up
        activeMatchedCards = [card1, card2];
        matchedPairsCount++;
        flippedCards = [];
        isBoardLocked = false;

        // Prompt user to tap either card to finalize
        if (matchedPairsCount === totalPairs) {
          statusText.textContent = '👆 請點擊最後一對卡牌完成遊戲！';
        }
      } else {
        // No match: Flip back upside down after 1.2s
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          isBoardLocked = false;
        }, 1200);
      }
    }

    function triggerVictory() {
      statusText.textContent = '🎉 完成所有配對！';
      
      // Show salient victory screen modal
      victoryOverlay.classList.remove('hidden');
      
      // Fire confetti cannon
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
        setTimeout(() => {
          confetti({
            particleCount: 60,
            angle: 60,
            spread: 55,
            origin: { x: 0 }
          });
          confetti({
            particleCount: 60,
            angle: 120,
            spread: 55,
            origin: { x: 1 }
          });
        }, 200);
      }
    }

    function closeVictoryOverlay() {
      victoryOverlay.classList.add('hidden');
    }

    function renderTracker(pool) {
      trackerList.innerHTML = '';
      pool.forEach(item => {
        const itemRow = document.createElement('div');
        itemRow.classList.add('tracker-item');
        itemRow.innerHTML = `
          <div class="tracker-info">
            <img src="${item.img}" class="tracker-thumb" alt="${item.name}">
            <span>${item.fullText}</span>
          </div>
          <div class="btn-group">
            <button class="track-btn correct" onclick="recordResult('${item.fullText}', true, this)">✓</button>
            <button class="track-btn incorrect" onclick="recordResult('${item.fullText}', false, this)">✗</button>
          </div>
        `;
        trackerList.appendChild(itemRow);
      });
      updateSummary();
    }

    function recordResult(fullText, isCorrect, btn) {
      const parentGroup = btn.parentElement;
      const btns = parentGroup.querySelectorAll('.track-btn');
      btns.forEach(b => b.classList.remove('active'));

      if (trackedResults[fullText].status === isCorrect) {
        trackedResults[fullText].status = null;
      } else {
        trackedResults[fullText].status = isCorrect;
        btn.classList.add('active');
      }

      updateSummary();
    }

    function updateSummary() {
      let totalRecorded = 0;
      let totalCorrect = 0;
      const classifierStats = {};

      selectedClassifiers.forEach(c => {
        classifierStats[c] = { correct: 0, total: 0 };
      });

      Object.values(trackedResults).forEach(res => {
        if (res.status !== null) {
          totalRecorded++;
          if (res.status === true) {
            totalCorrect++;
            if (classifierStats[res.classifier]) classifierStats[res.classifier].correct++;
          }
          if (classifierStats[res.classifier]) classifierStats[res.classifier].total++;
        }
      });

      if (totalRecorded === 0) {
        summaryBox.textContent = '總正確率：尚未紀錄';
        return;
      }

      const totalPct = Math.round((totalCorrect / totalRecorded) * 100);
      let details = `總正確率：${totalCorrect}/${totalRecorded} (${totalPct}%)`;

      const breakdown = selectedClassifiers.map(c => {
        const stat = classifierStats[c];
        if (stat.total === 0) return `${c}: -`;
        const pct = Math.round((stat.correct / stat.total) * 100);
        return `「${c}」: ${stat.correct}/${stat.total} (${pct}%)`;
      }).join(' | ');

      summaryBox.innerHTML = `<div>${details}</div><div style="font-size: 0.85rem; font-weight: normal; margin-top: 4px; color: #4A5568;">${breakdown}</div>`;
    }

    function exportTrackerAsImage() {
      const name = childNameInput.value.trim() || '未命名';
      
      // Temporarily expand height for html2canvas capture
      const originalMaxHeight = trackerList.style.maxHeight;
      const originalOverflow = trackerList.style.overflowY;
      trackerList.style.maxHeight = 'none';
      trackerList.style.overflowY = 'visible';

      html2canvas(trackerPanel, {
        useCORS: true,
        scale: 2,
        backgroundColor: '#FFFFFF'
      }).then(canvas => {
        // Restore styles
        trackerList.style.maxHeight = originalMaxHeight;
        trackerList.style.overflowY = originalOverflow;

        const link = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        link.download = `量詞學習紀錄_${name}_${dateStr}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => {
        // Restore styles if error occurs
        trackerList.style.maxHeight = originalMaxHeight;
        trackerList.style.overflowY = originalOverflow;
        alert('匯出圖片時發生錯誤，請稍後再試。');
      });
    }
  </script>
</body>
</html>
