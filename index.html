<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantonese Classifier Memory Game - SLP Edition</title>
  <!-- html2canvas for exporting performance report as image -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- canvas-confetti for celebratory confetti animation -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #4A90E2;
      --secondary: #2ECC71;
      --accent: #E74C3C;
      --bg: #F0F4F8;
      --card-bg: #FFFFFF;
      --card-back: #357ABD;
      --text: #2C3E50;
    }

    body {
      font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 5px;
      margin-bottom: 10px;
      color: var(--primary);
      text-align: center;
    }

    .setup-panel, .tracker-panel {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }

    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .checkbox-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: #EAEFF5;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 1.1rem;
    }

    .checkbox-btn input { display: none; }

    .checkbox-btn.selected {
      background: var(--primary);
      color: white;
      font-weight: bold;
    }

    select, button, input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #CCC;
      box-sizing: border-box;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #357ABD; }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 640px;
      width: 100%;
      margin-bottom: 20px;
    }

    .card {
      aspect-ratio: 1 / 1;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.4s ease-in-out;
      transform-style: preserve-3d;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 6px;
    }

    .card-back {
      background: var(--card-back);
      color: white;
      font-size: 2.2rem;
      font-weight: bold;
    }

    .card-front {
      background: var(--card-bg);
      transform: rotateY(180deg);
      border: 3px solid var(--primary);
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    /* GENTLE 2-TIMES BLINK ANIMATION & GREEN HIGHLIGHT */
    @keyframes gentle-blink-two-times {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .card.matched-highlight {
      animation: gentle-blink-two-times 0.4s ease-in-out 2;
    }

    .card.matched-highlight .card-front,
    .card.matched .card-front {
      border: 4px solid var(--secondary) !important;
      box-shadow: 0 0 14px rgba(46, 204, 113, 0.8) !important;
    }

    .card-img {
      width: 85%;
      height: 85%;
      object-fit: contain;
      border-radius: 6px;
    }

    /* Dimmed face-down matched state */
    .card.matched .card-inner {
      opacity: 0.35;
      filter: grayscale(60%);
    }

    /* Completion Overlay Pop-up Modal */
    .victory-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.3s ease-out;
    }

    .victory-modal {
      background: white;
      padding: 32px 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      max-width: 90%;
      width: 380px;
      animation: scaleUp 0.3s ease-out;
    }

    .victory-modal h2 {
      color: var(--secondary);
      font-size: 2.2rem;
      margin: 0 0 12px 0;
    }

    .victory-modal p {
      font-size: 1.15rem;
      color: var(--text);
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .victory-modal button {
      background: var(--secondary);
      font-size: 1.1rem;
      padding: 12px 28px;
      width: auto;
      border-radius: 10px;
    }

    .victory-modal button:hover {
      background: #27AE60;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleUp {
      from { transform: scale(0.75); }
      to { transform: scale(1); }
    }

    /* Tracker Panel */
    .tracker-panel {
      border: 2px solid var(--primary);
      background: #F8FAFC;
    }

    .tracker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #E2E8F0;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .tracker-header h2 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--primary);
    }

    .name-input-box {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .name-input-box label {
      margin-bottom: 0;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    .name-input-box input {
      padding: 6px 10px;
      font-size: 0.95rem;
    }

    .export-btn {
      width: auto;
      padding: 6px 12px;
      font-size: 0.85rem;
      background: var(--secondary);
    }

    .export-btn:hover { background: #27AE60; }

    .tracker-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .tracker-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #E2E8F0;
    }

    .tracker-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tracker-thumb {
      width: 32px;
      height: 32px;
      object-fit: cover;
      border-radius: 4px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .track-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      font-size: 1.1rem;
      border-radius: 6px;
      border: 1px solid #CCC;
      background: #EDF2F7;
      color: #4A5568;
    }

    .track-btn.correct.active {
      background: var(--secondary);
      color: white;
      border-color: var(--secondary);
    }

    .track-btn.incorrect.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .summary-box {
      background: white;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      border: 1px dashed var(--primary);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h1>量詞配對翻牌遊戲</h1>

  <!-- Setup Panel -->
  <div id="setup-panel" class="setup-panel">
    <div class="form-group">
      <label>1. 選擇 2 至 3 個目標量詞：</label>
      <div class="checkbox-group" id="classifier-options">
        <label class="checkbox-btn"><input type="checkbox" value="個">個</label>
        <label class="checkbox-btn"><input type="checkbox" value="條">條</label>
        <label class="checkbox-btn"><input type="checkbox" value="件">件</label>
        <label class="checkbox-btn"><input type="checkbox" value="隻">隻</label>
        <label class="checkbox-btn"><input type="checkbox" value="粒">粒</label>
        <label class="checkbox-btn"><input type="checkbox" value="架">架</label>
        <label class="checkbox-btn"><input type="checkbox" value="張">張</label>
        <label class="checkbox-btn"><input type="checkbox" value="塊">塊</label>
      </div>
    </div>

    <div class="form-group">
      <label for="card-count">2. 選擇卡牌總數：</label>
      <select id="card-count">
        <option value="8">8 張牌 (4 對)</option>
        <option value="10">10 張牌 (5 對)</option>
        <option value="12" selected>12 張牌 (6 對)</option>
        <option value="14">14 張牌 (7 對)</option>
        <option value="16">16 張牌 (8 對)</option>
      </select>
    </div>

    <button id="start-btn">開始遊戲 Start Game</button>
  </div>

  <!-- Game Controls -->
  <div id="game-controls" class="hidden" style="width: 100%; max-width: 640px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
    <button id="reset-btn" style="width: auto; padding: 8px 16px;">← 返回設定 Setup</button>
    <div id="status" style="font-weight: bold; color: var(--secondary);"></div>
  </div>

  <!-- Game Board -->
  <div id="game-board" class="game-board hidden"></div>

  <!-- Salient Victory Screen Modal Overlay -->
  <div id="victory-overlay" class="victory-overlay hidden">
    <div class="victory-modal">
      <h2>🎉 完成所有配對！</h2>
      <p>太棒了！你已經順利完成所有量詞卡牌配對！</p>
      <button onclick="closeVictoryOverlay()">確定 OK</button>
    </div>
  </div>

  <!-- Performance Tracker Panel -->
  <div id="tracker-panel" class="tracker-panel hidden">
    <div class="tracker-header">
      <h2>紀錄面板 (Data Tracker)</h2>
      <button class="export-btn" id="export-img-btn">📷 匯出紀錄圖片 (Export Image)</button>
    </div>

    <div class="name-input-box">
      <label for="child-name">學生/兒童名字 (Name):</label>
      <input type="text" id="child-name" placeholder="請輸入名字...">
    </div>

    <div class="tracker-list" id="tracker-list"></div>
    <div class="summary-box" id="summary-box">總正確率：尚未紀錄</div>
  </div>

  <script>
    const itemsDatabase = {
      '個': [
        { name: '蘋果', prefix: '一', img: '1.png' },
        { name: '橙', prefix: '一', img: '2.png' },
        { name: '蛋糕', prefix: '一', img: '3.png' },
        { name: '醫生', prefix: '一', img: '4.png' },
        { name: '波', prefix: '一', img: '5.png' },
        { name: '老師', prefix: '一', img: '6.png' },
        { name: '警察', prefix: '一', img: '7.png' },
        { name: '漢堡包', prefix: '一', img: '8.png' }
      ],
      '條': [
        { name: '魚', prefix: '一', img: '9.png' },
        { name: '香蕉', prefix: '兩', img: '10.png' },
        { name: '褲', prefix: '一', img: '11.png' },
        { name: '毛巾', prefix: '一', img: '12.png' },
        { name: '頭髮', prefix: '一', img: '13.png' },
        { name: '裙', prefix: '一', img: '14.png' },
        { name: '蛇', prefix: '一', img: '15.png' },
        { name: '薯條', prefix: '八', img: '16.png' }
      ],
      '件': [
        { name: '衫', prefix: '一', img: '17.png' },
        { name: '外套', prefix: '一', img: '18.png' },
        { name: '睡衣', prefix: '一', img: '19.png' },
        { name: '泳衣', prefix: '一', img: '20.png' },
        { name: '雨衣', prefix: '一', img: '21.png' },
        { name: '衫', prefix: '一', img: '22.png' },
        { name: '冷衫', prefix: '一', img: '23.png' }
      ],
      '隻': [
        { name: '狗', prefix: '一', img: '24.png' },
        { name: '貓', prefix: '一', img: '25.png' },
        { name: '雀仔', prefix: '一', img: '26.png' },
        { name: '兔子', prefix: '兩', img: '27.png' },
        { name: '大象', prefix: '一', img: '28.png' },
        { name: '獅子', prefix: '一', img: '29.png' },
        { name: '烏龜', prefix: '三', img: '30.png' },
        { name: '長頸鹿', prefix: '一', img: '31.png' }
      ],
      '粒': [
        { name: '糖', prefix: '一', img: '32.png' },
        { name: '藍莓', prefix: '一', img: '33.png' },
        { name: '草莓', prefix: '一', img: '34.png' },
        { name: '粟米', prefix: '一', img: '35.png' },
        { name: '糖', prefix: '一', img: '36.png' },
        { name: '藥丸', prefix: '三', img: '37.png' },
        { name: '寶石', prefix: '三', img: '38.png' },
        { name: '車厘子', prefix: '一', img: '39.png' }
      ],
      '架': [
        { name: '車', prefix: '一', img: '40.png' },
        { name: '飛機', prefix: '一', img: '41.png' },
        { name: '單車', prefix: '一', img: '42.png' },
        { name: '巴士', prefix: '一', img: '43.png' },
        { name: '列車', prefix: '一', img: '44.png' },
        { name: '直升機', prefix: '一', img: '45.png' },
        { name: '消防車', prefix: '一', img: '46.png' },
        { name: '警車', prefix: '一', img: '47.png' }
      ],
      '張': [
        { name: '紙巾', prefix: '一', img: '48.png' },
        { name: '櫈', prefix: '一', img: '49.png' },
        { name: '床', prefix: '一', img: '50.png' },
        { name: '枱', prefix: '一', img: '51.png' },
        { name: '相片', prefix: '三', img: '52.png' },
        { name: '八達通', prefix: '一', img: '53.png' },
        { name: '貼紙', prefix: '三', img: '54.png' },
        { name: '梳化', prefix: '一', img: '55.png' }
      ],
      '塊': [
        { name: '餅乾', prefix: '兩', img: '56.png' },
        { name: '餅乾', prefix: '一', img: '57.png' },
        { name: '鏡子', prefix: '一', img: '58.png' },
        { name: '披薩', prefix: '一', img: '59.png' },
        { name: '麵包', prefix: '一', img: '60.png' },
        { name: '芝士', prefix: '兩', img: '61.png' },
        { name: '番茄', prefix: '三', img: '62.png' },
        { name: '拼圖', prefix: '四', img: '63.png' }
      ]
    };

    let selectedClassifiers = [];
    let flippedCards = [];
    let activeMatchedCards = [];
    let matchedPairsCount = 0;
    let totalPairs = 0;
    let isBoardLocked = false;
    let trackedResults = {};

    const setupPanel = document.getElementById('setup-panel');
    const gameBoard = document.getElementById('game-board');
    const gameControls = document.getElementById('game-controls');
    const trackerPanel = document.getElementById('tracker-panel');
    const trackerList = document.getElementById('tracker-list');
    const summaryBox = document.getElementById('summary-box');
    const statusText = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const exportImgBtn = document.getElementById('export-img-btn');
    const childNameInput = document.getElementById('child-name');
    const victoryOverlay = document.getElementById('victory-overlay');
    const classifierBoxes = document.querySelectorAll('#classifier-options input');

    classifierBoxes.forEach(box => {
      box.addEventListener('change', (e) => {
        const parent = e.target.parentElement;
        if (e.target.checked) parent.classList.add('selected');
        else parent.classList.remove('selected');
      });
    });

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', () => {
      finalizeActiveCards();
      closeVictoryOverlay();
      gameBoard.classList.add('hidden');
      gameControls.classList.add('hidden');
      trackerPanel.classList.add('hidden');
      setupPanel.classList.remove('hidden');
    });

    exportImgBtn.addEventListener('click', exportTrackerAsImage);

    function startGame() {
      finalizeActiveCards();
      closeVictoryOverlay();
      
      selectedClassifiers = Array.from(classifierBoxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);

      if (selectedClassifiers.length < 2 || selectedClassifiers.length > 3) {
        alert('請選擇 2 至 3 個目標量詞！');
        return;
      }

      const cardCount = parseInt(document.getElementById('card-count').value);
      totalPairs = cardCount / 2;

      const chosenPool = [];
      let currentClassifierIdx = 0;

      const tempDatabase = {};
      selectedClassifiers.forEach(c => {
        tempDatabase[c] = [...itemsDatabase[c]];
      });

      while (chosenPool.length < totalPairs) {
        const classifier = selectedClassifiers[currentClassifierIdx % selectedClassifiers.length];
        const items = tempDatabase[classifier];

        if (items.length > 0) {
          const randomIdx = Math.floor(Math.random() * items.length);
          const pickedItem = items.splice(randomIdx, 1)[0];
          const prefix = pickedItem.prefix || '一';
          
          chosenPool.push({
            classifier: classifier,
            name: pickedItem.name,
            img: pickedItem.img,
            fullText: `${prefix}${classifier}${pickedItem.name}`
          });
        }
        currentClassifierIdx++;
      }

      let cardsData = [...chosenPool, ...chosenPool].map((item, index) => ({ ...item, id: index }));
      cardsData = shuffle(cardsData);

      trackedResults = {};
      chosenPool.forEach(item => {
        trackedResults[item.fullText] = { classifier: item.classifier, img: item.img, status: null };
      });

      renderBoard(cardsData);
      renderTracker(chosenPool);

      setupPanel.classList.add('hidden');
      gameControls.classList.remove('hidden');
      gameBoard.classList.remove('hidden');
      trackerPanel.classList.remove('hidden');
      statusText.textContent = '';
      matchedPairsCount = 0;
      flippedCards = [];
      activeMatchedCards = [];
      isBoardLocked = false;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function renderBoard(cards) {
      gameBoard.innerHTML = '';
      cards.forEach(card => {
        const cardElem = document.createElement('div');
        cardElem.classList.add('card');
        cardElem.dataset.fullText = card.fullText;

        cardElem.innerHTML = `
          <div class="card-inner">
            <div class="card-back">?</div>
            <div class="card-front">
              <img src="${card.img}" class="card-img" alt="${card.name}">
            </div>
          </div>
        `;

        cardElem.addEventListener('click', () => handleCardClick(cardElem));
        gameBoard.appendChild(cardElem);
      });
    }

    // Turns active face-up matched cards face-down
    function finalizeActiveCards() {
      if (activeMatchedCards.length > 0) {
        activeMatchedCards.forEach(c => {
          c.classList.remove('flipped', 'matched-highlight');
          c.classList.add('matched');
        });
        activeMatchedCards = [];
      }
    }

    function handleCardClick(card) {
      if (isBoardLocked) return;

      // SPECIAL CASE: Tapping active face-up matched card(s)
      if (activeMatchedCards.includes(card)) {
        if (matchedPairsCount === totalPairs) {
          // If this was the final pair on the board, highlight, flip face-down, and trigger victory!
          isBoardLocked = true;
          activeMatchedCards.forEach(c => c.classList.add('matched-highlight'));
          setTimeout(() => {
            finalizeActiveCards();
            triggerVictory();
            isBoardLocked = false;
          }, 800);
        } else {
          // Normal pair tap: flip face-down
          finalizeActiveCards();
        }
        return;
      }

      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

      // If tapping any other card, close previous active matched pair
      finalizeActiveCards();

      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        checkMatch();
      }
    }

    function checkMatch() {
      isBoardLocked = true;
      const [card1, card2] = flippedCards;

      if (card1.dataset.fullText === card2.dataset.fullText) {
        // Keeps the matched cards active & face-up
        activeMatchedCards = [card1, card2];
        matchedPairsCount++;
        flippedCards = [];

        // Instantly add short blinking effect and green border highlighting to matched cards
        card1.classList.add('matched-highlight');
        card2.classList.add('matched-highlight');

        isBoardLocked = false;

        // Prompt user to tap either card to finalize
        if (matchedPairsCount === totalPairs) {
          statusText.textContent = '👆 請點擊最後一對卡牌完成遊戲！';
        }
      } else {
        // No match: Flip back upside down after 1.2s
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          isBoardLocked = false;
        }, 1200);
      }
    }

    function triggerVictory() {
      statusText.textContent = '🎉 完成所有配對！';
      
      // Show salient victory screen modal
      victoryOverlay.classList.remove('hidden');
      
      // Fire confetti cannon
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    function closeVictoryOverlay() {
      victoryOverlay.classList.add('hidden');
    }

    function renderTracker(items) {
      trackerList.innerHTML = '';
      items.forEach(item => {
        const itemElem = document.createElement('div');
        itemElem.classList.add('tracker-item');

        itemElem.innerHTML = `
          <div class="tracker-info">
            <img src="${item.img}" class="tracker-thumb" alt="${item.name}">
            <span>${item.fullText}</span>
          </div>
          <div class="btn-group">
            <button class="track-btn correct" onclick="setTrackStatus('${item.fullText}', true, this)">✓</button>
            <button class="track-btn incorrect" onclick="setTrackStatus('${item.fullText}', false, this)">✗</button>
          </div>
        `;
        trackerList.appendChild(itemElem);
      });
      updateSummary();
    }

    function setTrackStatus(fullText, isCorrect, btn) {
      const parent = btn.parentElement;
      const btns = parent.querySelectorAll('.track-btn');
      btns.forEach(b => b.classList.remove('active'));

      if (trackedResults[fullText].status === isCorrect) {
        trackedResults[fullText].status = null;
      } else {
        trackedResults[fullText].status = isCorrect;
        btn.classList.add('active');
      }
      updateSummary();
    }

    function updateSummary() {
      let totalTracked = 0;
      let correctCount = 0;
      const classifierStats = {};

      selectedClassifiers.forEach(c => {
        classifierStats[c] = { total: 0, correct: 0 };
      });

      Object.values(trackedResults).forEach(res => {
        if (res.status !== null) {
          totalTracked++;
          if (res.classifier && classifierStats[res.classifier]) {
            classifierStats[res.classifier].total++;
          }
          if (res.status === true) {
            correctCount++;
            if (res.classifier && classifierStats[res.classifier]) {
              classifierStats[res.classifier].correct++;
            }
          }
        }
      });

      if (totalTracked === 0) {
        summaryBox.innerHTML = '總正確率：尚未紀錄';
        return;
      }

      const overallAccuracy = Math.round((correctCount / totalTracked) * 100);
      let summaryHTML = `總正確率：${correctCount} / ${totalTracked} (${overallAccuracy}%)<br><hr style="border:0; border-top:1px solid #E2E8F0; margin:6px 0;">`;

      const breakdown = [];
      selectedClassifiers.forEach(c => {
        const stats = classifierStats[c];
        if (stats.total > 0) {
          const acc = Math.round((stats.correct / stats.total) * 100);
          breakdown.push(`「${c}」: ${stats.correct}/${stats.total} (${acc}%)`);
        } else {
          breakdown.push(`「${c}」: 未有紀錄`);
        }
      });

      summaryHTML += breakdown.join(' | ');
      summaryBox.innerHTML = summaryHTML;
    }

    function exportTrackerAsImage() {
      if (typeof html2canvas !== 'function') {
        alert('圖片匯出模組載入失敗，請檢查網絡連線。');
        return;
      }

      html2canvas(trackerPanel, { scale: 2 }).then(canvas => {
        const childName = childNameInput.value.trim() || '學生';
        const link = document.createElement('a');
        link.download = `${childName}_量詞練習紀錄.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => {
        alert('匯出圖片時發生錯誤：' + err);
      });
    }
  </script>
</body>
</html>
