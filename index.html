<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantonese Classifier Memory Game - SLP Edition</title>
  <style>
    :root {
      --primary: #4A90E2;
      --secondary: #2ECC71;
      --accent: #E74C3C;
      --bg: #F0F4F8;
      --card-bg: #FFFFFF;
      --card-back: #357ABD;
      --text: #2C3E50;
    }

    body {
      font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 5px;
      margin-bottom: 10px;
      color: var(--primary);
      text-align: center;
    }

    .setup-panel, .tracker-panel {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }

    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .checkbox-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: #EAEFF5;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 1.1rem;
    }

    .checkbox-btn input { display: none; }

    .checkbox-btn.selected {
      background: var(--primary);
      color: white;
      font-weight: bold;
    }

    select, button {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #CCC;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #357ABD; }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 640px;
      width: 100%;
      margin-bottom: 20px;
    }

    .card {
      aspect-ratio: 1 / 1;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.5s;
      transform-style: preserve-3d;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .card.flipped .card-inner { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 6px;
    }

    .card-back {
      background: var(--card-back);
      color: white;
      font-size: 2.2rem;
      font-weight: bold;
    }

    .card-front {
      background: var(--card-bg);
      transform: rotateY(180deg);
      border: 2px solid var(--primary);
    }

    .card-img {
      width: 85%;
      height: 85%;
      object-fit: contain;
      border-radius: 6px;
    }

    @keyframes blink-success {
      0% { opacity: 1; transform: scale(1); }
      25% { opacity: 0.3; transform: scale(1.05); }
      50% { opacity: 1; transform: scale(1.05); }
      75% { opacity: 0.3; transform: scale(1.05); }
      100% { opacity: 0.5; transform: scale(1); }
    }

    .card.blinking .card-inner {
      animation: blink-success 0.8s ease-in-out forwards;
      border: 3px solid var(--secondary);
    }

    .card.matched .card-inner {
      opacity: 0.5;
      border: 2px solid var(--secondary);
    }

    /* Tracker Panel */
    .tracker-panel {
      border: 2px solid var(--primary);
      background: #F8FAFC;
    }

    .tracker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #E2E8F0;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    .tracker-header h2 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--primary);
    }

    .export-btn {
      width: auto;
      padding: 6px 12px;
      font-size: 0.85rem;
      background: var(--secondary);
    }

    .export-btn:hover { background: #27AE60; }

    .tracker-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .tracker-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #E2E8F0;
    }

    .tracker-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tracker-thumb {
      width: 32px;
      height: 32px;
      object-fit: cover;
      border-radius: 4px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .track-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      font-size: 1.1rem;
      border-radius: 6px;
      border: 1px solid #CCC;
      background: #EDF2F7;
      color: #4A5568;
    }

    .track-btn.correct.active {
      background: var(--secondary);
      color: white;
      border-color: var(--secondary);
    }

    .track-btn.incorrect.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .summary-box {
      background: white;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      border: 1px dashed var(--primary);
    }

    .hidden { display: none !important; }
  </style>
</head>

  <h1>量詞配對翻牌遊戲</h1>

  <!-- Setup Panel -->
  <div id="setup-panel" class="setup-panel">
    <div class="form-group">
      <label>1. 選擇 2 至 3 個目標量詞：</label>
      <div class="checkbox-group" id="classifier-options">
        <label class="checkbox-btn"><input type="checkbox" value="個">個</label>
        <label class="checkbox-btn"><input type="checkbox" value="條">條</label>
        <label class="checkbox-btn"><input type="checkbox" value="件">件</label>
        <label class="checkbox-btn"><input type="checkbox" value="隻">隻</label>
        <label class="checkbox-btn"><input type="checkbox" value="粒">粒</label>
        <label class="checkbox-btn"><input type="checkbox" value="架">架</label>
        <label class="checkbox-btn"><input type="checkbox" value="張">張</label>
        <label class="checkbox-btn"><input type="checkbox" value="塊">塊</label>
      </div>
    </div>

    <div class="form-group">
      <label for="card-count">2. 選擇卡牌總數：</label>
      <select id="card-count">
        <option value="8">8 張牌 (4 對)</option>
        <option value="10">10 張牌 (5 對)</option>
        <option value="12" selected>12 張牌 (6 對)</option>
        <option value="14">14 張牌 (7 對)</option>
        <option value="16">16 張牌 (8 對)</option>
      </select>
    </div>

    <button id="start-btn">開始遊戲 Start Game</button>
  </div>

  <!-- Game Controls -->
  <div id="game-controls" class="hidden" style="width: 100%; max-width: 640px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
    <button id="reset-btn" style="width: auto; padding: 8px 16px;">← 返回設定 Setup</button>
    <div id="status" style="font-weight: bold; color: var(--secondary);"></div>
  </div>

  <!-- Game Board -->
  <div id="game-board" class="game-board hidden"></div>

    <div class="tracker-list" id="tracker-list"></div>
    <div class="summary-box" id="summary-box">總正確率：尚未紀錄</div>
  </div>

    const classifierBoxes = document.querySelectorAll('#classifier-options input');

    classifierBoxes.forEach(box => {
      box.addEventListener('change', (e) => {
        const parent = e.target.parentElement;
        if (e.target.checked) parent.classList.add('selected');
        else parent.classList.remove('selected');
      });
    });

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', () => {
      gameBoard.classList.add('hidden');
      gameControls.classList.add('hidden');
      trackerPanel.classList.add('hidden');
      setupPanel.classList.remove('hidden');
    });

    exportImgBtn.addEventListener('click', exportTrackerAsImage);

    function startGame() {
      selectedClassifiers = Array.from(classifierBoxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);

      if (selectedClassifiers.length < 2 || selectedClassifiers.length > 3) {
        alert('請選擇 2 至 3 個目標量詞！');
        return;
      }

      const cardCount = parseInt(document.getElementById('card-count').value);
      totalPairs = cardCount / 2;

      const chosenPool = [];
      let currentClassifierIdx = 0;

      const tempDatabase = {};
      selectedClassifiers.forEach(c => {
        tempDatabase[c] = [...itemsDatabase[c]];
      });

      while (chosenPool.length < totalPairs) {
        const classifier = selectedClassifiers[currentClassifierIdx % selectedClassifiers.length];
        const items = tempDatabase[classifier];

        if (items.length > 0) {
          const randomIdx = Math.floor(Math.random() * items.length);
          const pickedItem = items.splice(randomIdx, 1)[0];
          
          chosenPool.push({
            classifier: classifier,
            name: pickedItem.name,
            img: pickedItem.img,
            fullText: `一${classifier}${pickedItem.name}`
          });
        }
        currentClassifierIdx++;
      }

      let cardsData = [...chosenPool, ...chosenPool].map((item, index) => ({ ...item, id: index }));
      cardsData = shuffle(cardsData);

      trackedResults = {};
      chosenPool.forEach(item => {
        trackedResults[item.fullText] = { classifier: item.classifier, status: null };
      });

      renderBoard(cardsData);
      renderTracker(chosenPool);

      setupPanel.classList.add('hidden');
      gameControls.classList.remove('hidden');
      gameBoard.classList.remove('hidden');
      trackerPanel.classList.remove('hidden');
      statusText.textContent = '';
      matchedPairsCount = 0;
      flippedCards = [];
      isBoardLocked = false;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function renderBoard(cards) {
      gameBoard.innerHTML = '';
      cards.forEach(card => {
        const cardElem = document.createElement('div');
        cardElem.classList.add('card');
        cardElem.dataset.fullText = card.fullText;

        cardElem.innerHTML = `
          <div class="card-inner">
            <div class="card-back">?</div>
            <div class="card-front">
              <img src="${card.img}" class="card-img" alt="${card.name}">
            </div>
          </div>
        `;

        cardElem.addEventListener('click', () => handleCardClick(cardElem));
        gameBoard.appendChild(cardElem);
      });
    }

    function handleCardClick(card) {
      if (isBoardLocked) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched') || card.classList.contains('blinking')) return;

      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        checkMatch();
      }
    }

    function checkMatch() {
      isBoardLocked = true;
      const [card1, card2] = flippedCards;

      if (card1.dataset.fullText === card2.dataset.fullText) {
        card1.classList.add('blinking');
        card2.classList.add('blinking');

        setTimeout(() => {
          card1.classList.remove('blinking');
          card2.classList.remove('blinking');
          card1.classList.add('matched');
          card2.classList.add('matched');
          matchedPairsCount++;
          flippedCards = [];
          isBoardLocked = false;

          if (matchedPairsCount === totalPairs) {
            statusText.textContent = '🎉 完成所有配對！';
          }
        }, 800);
      } else {
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          isBoardLocked = false;
        }, 1200);
      }
    }

    function renderTracker(pool) {
      trackerList.innerHTML = '';
      pool.forEach(item => {
        const itemRow = document.createElement('div');
        itemRow.classList.add('tracker-item');
        itemRow.innerHTML = `
          <div class="tracker-info">
            <img src="${item.img}" class="tracker-thumb" alt="${item.name}">
            <span>${item.fullText}</span>
          </div>
          <div class="btn-group">
            <button class="track-btn correct" onclick="recordResult('${item.fullText}', true, this)">✓</button>
            <button class="track-btn incorrect" onclick="recordResult('${item.fullText}', false, this)">✗</button>
          </div>
        `;
        trackerList.appendChild(itemRow);
      });
      updateSummary();
    }

    window.recordResult = function(fullText, isCorrect, btnElement) {
      const parent = btnElement.parentElement;
      parent.querySelectorAll('.track-btn').forEach(b => b.classList.remove('active'));

      if (trackedResults[fullText].status === isCorrect) {
        trackedResults[fullText].status = null;
      } else {
        trackedResults[fullText].status = isCorrect;
        btnElement.classList.add('active');
      }
      updateSummary();
    };

    function updateSummary() {
      let totalAssessed = 0;
      let totalCorrect = 0;
      const classifierBreakdown = {};

      selectedClassifiers.forEach(c => classifierBreakdown[c] = { correct: 0, total: 0 });

      Object.values(trackedResults).forEach(res => {
        if (res.status !== null) {
          totalAssessed++;
          classifierBreakdown[res.classifier].total++;
          if (res.status === true) {
            totalCorrect++;
            classifierBreakdown[res.classifier].correct++;
          }
        }
      });

      if (totalAssessed === 0) {
        summaryBox.textContent = '總正確率：尚未點擊紀錄 (0/0)';
        return;
      }

      const percent = Math.round((totalCorrect / totalAssessed) * 100);
      let breakdownText = Object.entries(classifierBreakdown)
        .filter(([_, data]) => data.total > 0)
        .map(([cls, data]) => `${cls}: ${data.correct}/${data.total}`)
        .join(' | ');

      summaryBox.innerHTML = `
        <div>總正確率：${percent}% (${totalCorrect}/${totalAssessed})</div>
        <div style="font-weight: normal; font-size: 0.85rem; color: #4A5568; margin-top: 4px;">分項統計：${breakdownText}</div>
      `;
    }

    /* Export Tracker Result as Image */
    function exportTrackerAsImage() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      const items = Object.entries(trackedResults);
      const width = 500;
      const rowHeight = 40;
      const headerHeight = 110;
      const height = headerHeight + (items.length * rowHeight) + 80;

      canvas.width = width;
      canvas.height = height;

      // Background
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, width, height);

      // Border
      ctx.strokeStyle = '#4A90E2';
      ctx.lineWidth = 4;
      ctx.strokeRect(10, 10, width - 20, height - 20);

      // Title & Date
      ctx.fillStyle = '#4A90E2';
      ctx.font = 'bold 20px "PingFang HK", "Microsoft JhengHei", sans-serif';
      ctx.fillText('紀錄面板 (Data Tracker)', 30, 45);

      const today = new Date().toLocaleDateString('zh-HK');
      ctx.fillStyle = '#718096';
      ctx.font = '14px sans-serif';
      ctx.fillText(`日期 Date: ${today}`, 30, 70);

      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(30, 85);
      ctx.lineTo(width - 30, 85);
      ctx.stroke();

      // Items list
      let y = 115;
      items.forEach(([itemText, data]) => {
        ctx.fillStyle = '#2C3E50';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(`• ${itemText}`, 30, y);

        let statusText = '未紀錄 (N/A)';
        let statusColor = '#A0AEC0';

        if (data.status === true) {
          statusText = '正確 (✓)';
          statusColor = '#2ECC71';
        } else if (data.status === false) {
          statusText = '錯誤 (✗)';
          statusColor = '#E74C3C';
        }

        ctx.fillStyle = statusColor;
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(statusText, width - 150, y);

        y += rowHeight;
      });

      // Summary Box
      ctx.strokeStyle = '#4A90E2';
      ctx.strokeRect(30, y, width - 60, 50);

      ctx.fillStyle = '#2C3E50';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(summaryBox.innerText.replace('\n', ' - '), 40, y + 30);

      // Download trigger
      const link = document.createElement('a');
      link.download = `量詞紀錄_${today.replace(/\//g, '-')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
